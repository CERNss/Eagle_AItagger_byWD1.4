name: CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          grep -v -E '^(onnxruntime-gpu)' requirements.txt > /tmp/requirements-ci.txt
          grep -v -E '^(-r requirements.txt|onnxruntime-gpu)' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-ci.txt -r /tmp/requirements-dev-ci.txt "onnxruntime>=1.19,<2.0"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q main.py service scripts tests

      - name: Validate shell scripts
        run: bash -n init.sh build.sh

      - name: Validate Docker Compose config
        run: docker compose config > /tmp/eagle-ai-tagger-compose.yaml

      - name: Validate OpenSpec specs
        run: openspec validate --specs --strict --no-interactive

  container-image:
    name: Build and push container image
    runs-on: ubuntu-22.04
    needs: checks
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
