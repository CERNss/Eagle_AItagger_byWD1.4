name: CI/CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag for manual publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          grep -v -E '^(onnxruntime-gpu)' requirements.txt > /tmp/requirements-ci.txt
          grep -v -E '^(-r requirements.txt|onnxruntime-gpu)' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-ci.txt -r /tmp/requirements-dev-ci.txt "onnxruntime>=1.19,<2.0"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q main.py service scripts tests

      - name: Validate shell scripts
        run: bash -n init.sh build.sh

      - name: Validate Docker Compose config
        run: docker compose config > /tmp/eagle-ai-tagger-compose.yaml

      - name: Validate OpenSpec specs
        run: openspec validate --specs --strict --no-interactive

  container-image:
    name: Build and push container image
    runs-on: ubuntu-22.04
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce develop release source
        run: |
          git fetch origin develop --prune
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/develop" ]]; then
              echo "Manual package publishing must be run from the develop branch." >&2
              exit 1
            fi
            exit 0
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop; then
            echo "Package tags must point to a commit contained in origin/develop." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        run: |
          repository="${DOCKERHUB_REPOSITORY:-cernss/eagle-ai-tagger}"
          echo "IMAGE_NAME=${repository}" >> "$GITHUB_ENV"
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

      - name: Validate Docker Hub credentials
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required." >&2
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
