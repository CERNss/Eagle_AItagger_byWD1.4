services:
  tagger:
    build:
      context: .
      dockerfile: Dockerfile
    image: eagle-ai-tagger:latest
    container_name: eagle-ai-tagger
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /model/swinv2-v3.onnx
      TAGS_PATH: /csv/Tags-cn_2024_ver-1.0.csv
      IMAGE_ROOT: /data/images
      DEFAULT_THRESHOLD: "0.5"
      USE_CHINESE_NAME: "true"
      DEFAULT_TOP_K: "50"
      BATCH_LIMIT: "64"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      OTEL_ENABLED: "false"
      OTEL_METRICS_ENABLED: "false"
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
      OTEL_TRACE_SAMPLE_RATIO: "0.1"
      NVIDIA_VISIBLE_DEVICES: "all"
    volumes:
      - ./model:/model:ro
      - ./csv:/csv:ro
      - /data/app/shared-images:/data/images:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
