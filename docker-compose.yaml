services:
  tagger:
    build:
      context: .
      dockerfile: Dockerfile
    image: eagle-ai-tagger:latest
    container_name: eagle-ai-tagger
    ports:
      - "8000:8000"
    # Application tunables live in config.yaml (mounted below). Only container
    # wiring stays here; .env supplies secrets and overrides (env wins over yaml).
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_PATH: /app/config.yaml
      MODEL_PATH: /model/swinv2-v3.onnx
      TAGS_PATH: /csv/Tags-cn_2024_ver-1.0.csv
      IMAGE_ROOT: /data/images
      REQUIRE_CUDA: "true"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./model
        target: /model
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./csv
        target: /csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IMAGE_ROOT:-/srv/shared-images}
        target: /data/images
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # /livez reflects a dead/hung GPU session, so a "running but broken"
      # container actually fails the check and gets restarted.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        # Cap host memory so a pathological image OOM-kills only this container
        # (then restart recovers) instead of pressuring the host. Tune to taste.
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
